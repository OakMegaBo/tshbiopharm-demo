<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <title>東生華製藥 — 個案管理後台</title>
  <link rel="icon" href="https://www.tshbiopharm.com/rwd1427/store/f1/shortcut.ico" type="image/x-icon">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://scrm.oakmega.site/0/css/primeicons.css">
  <style>
    *, *::before, *::after { box-sizing: border-box;  }
    [v-cloak] { display: none }
    :root {
      /* 東生華品牌青綠 rgb(71,204,200) = brand-400：按鈕與色塊用亮青綠＋白字，連結等文字用 brand-700 */
      --brand-50:#EAF8F7; --brand-100:#D2F1F0; --brand-200:#A6E3E1; --brand-400:#47CCC8;
      --brand-500:#1FA9A5; --brand-700:#0A6E6B;
      --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EEF2F5;
      --border:#DDE3E9; --border-strong:#B8C4CE;
      --text-primary:#1A2530; --text-secondary:#4A5C6A; --text-muted:#7A8F9E;
      --green:#276B3C; --green-light:#E6F3EA;
      --red:#B93028; --red-light:#FCECEA;
      --amber:#B45309; --amber-light:#FFF4E5;
      --docx:#1d4ed8; --docx-light:#dbeafe;
      --red-border:#f0c0bb; --amber-border:#FDD08A;
      /* 進度條、時間軸等非文字色塊用亮色 */
      --status-active:#47CCC8; --status-done:#3BAA6A; --status-overdue:#F59E0B; --status-terminated:#E5484D;
      --font:'Noto Sans TC',sans-serif;
      /* 字級：12 輔助／標籤、14 內文、16 區塊標題、20 頁面標題 */
      --fs-12:12px; --fs-14:14px; --fs-16:16px; --fs-20:20px;
      --radius:8px; --radius-lg:12px;
    }
    body { font-variant-numeric:tabular-nums; font-family:var(--font); background:var(--bg); color:var(--text-primary); font-size:var(--fs-14); line-height:1.6; min-height:100vh; }
    .app-shell { display:flex; height:100vh; overflow:hidden; }

    /* Sidebar */
    .sidebar { width:220px; flex-shrink:0; border-right:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column; height:100vh; overflow-y:auto; }
    .sidebar-logo { height:54px; flex-shrink:0; display:flex; align-items:center; padding:0 28px; background:var(--surface); }
    .sidebar-logo img { display:block; height:40px; width:auto; max-width:100%; object-fit:contain; }
    .sidebar-footer { margin-top:auto; padding:16px; border-top:1px solid var(--border); }
    .sidebar-account { display:flex; align-items:center; gap:10px; margin-bottom:10px; padding:0 8px; }
    .sidebar-account-info { flex:1; min-width:0; }
    .sidebar-account-name { display:flex; align-items:center; gap:8px; font-size:var(--fs-14); font-weight:500; color:var(--text-primary); }
    .sidebar-account-role.p-tag { padding:1px 6px; font-size:var(--fs-12); font-weight:500; line-height:1.5; }
    .sidebar-account-email { font-size:var(--fs-12); color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* Main */
    .page-host { flex:1; overflow-y:auto; min-width:0; display:flex; flex-direction:column; }
    .topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:0 28px; height:54px; display:flex; align-items:center; gap:8px; position:sticky; top:0; z-index:10; flex-shrink:0; }
    .topbar-actions { margin-left:auto; display:flex; align-items:center; gap:8px; }
    .topbar .p-breadcrumb-item-link, .topbar .p-breadcrumb-item-label { color:var(--brand-700); }
    .topbar .p-breadcrumb-item:first-child .p-breadcrumb-item-link, .topbar .p-breadcrumb-item:first-child .p-breadcrumb-item-label { color:var(--text-muted); }
    .topbar .p-breadcrumb-item:last-child .p-breadcrumb-item-link, .topbar .p-breadcrumb-item:last-child .p-breadcrumb-item-label { color:var(--text-primary); font-weight:600; }
    .topbar .p-breadcrumb-separator { color:var(--border-strong); }
    .topbar .p-breadcrumb-separator svg { width:9px; height:9px; }
    .content { padding:24px 28px 80px; flex:1; }
    .page-header { margin-bottom:22px; }
    .page-title { font-size:var(--fs-20); font-weight:600; line-height:1.4; margin-bottom:4px; }
    .page-subtitle { font-size:var(--fs-14); color:var(--text-muted); }


    /* Table */
    .table-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
    .table-toolbar.p-toolbar { border:0; border-bottom:1px solid var(--border); border-radius:0; }
    .table-summary { display:flex; justify-content:flex-end; padding:12px 20px; color:var(--text-muted); font-size:var(--fs-12); }
    .table-toolbar .p-toolbar-start { display:flex; align-items:center; gap:10px; flex:1; flex-wrap:wrap; }
    .count-label { font-size:var(--fs-12); color:var(--text-muted); margin-left:auto; white-space:nowrap; }



    /* Chips */
    .tags-row { display:flex; flex-wrap:wrap; gap:4px 16px; }
    /* 表格與清單文字 */
    .person-name { font-size:var(--fs-14); font-weight:500; }
    .cell-text { font-size:var(--fs-14); }
    .cell-text-secondary { font-size:var(--fs-14); color:var(--text-secondary); }
    .cell-meta { font-size:var(--fs-12); color:var(--text-muted); white-space:nowrap; }
    .cell-value { font-size:var(--fs-14); color:var(--text-secondary); white-space:nowrap; }
    .case-id { font-size:var(--fs-12); color:var(--text-muted); white-space:nowrap; }
    .case-identity { display:flex; align-items:center; gap:6px; }
    .case-identity + .text-sm { margin-top:2px; }
    .progress-label { font-size:var(--fs-12); color:var(--text-muted); }
    .progress-count { font-size:var(--fs-14); font-weight:600; color:var(--brand-700); }
    .person-link.p-button { padding:0; font-size:var(--fs-14); }
    .field-label-row { display:flex; align-items:center; gap:8px; }
    .info-row .field-label { margin-bottom:4px; }
    .section-hint { font-size:var(--fs-12); color:var(--text-muted); }
    .row-actions { display:flex; gap:8px; }
    .content-narrow { max-width:860px; }
    .empty-state-compact { padding:30px 0; }
    /* 待上傳檔案 */
    .pending-file { margin-bottom:10px; padding:14px 16px; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--bg); }
    .pending-file-row { display:flex; align-items:center; gap:10px; }
    .pending-file-info { flex:1; min-width:0; }
    .pending-file-name { font-size:var(--fs-12); font-weight:500; }
    .pending-file-meta { font-size:var(--fs-12); color:var(--text-muted); }
    .file-empty { padding:14px 0; text-align:center; color:var(--text-muted); font-size:var(--fs-12); }
    /* 對話框 */
    .dialog-md { width:480px; max-width:calc(100vw - 32px); }
    .dialog-sm { width:400px; max-width:calc(100vw - 32px); }
    .dialog-form { display:flex; flex-direction:column; gap:16px; padding-top:4px; }
    .dialog-body { padding-top:4px; }
    .checkbox-label { font-size:var(--fs-14); color:var(--text-secondary); cursor:pointer; }
    .n2-ext-row { display:flex; align-items:center; gap:7px; font-size:var(--fs-12); }
    .n2-ext-label { color:var(--amber); cursor:pointer; }


    /* Detail layout */
    .detail-layout { display:grid; grid-template-columns:1fr 310px; gap:20px; align-items:start; }
    .section-title { font-size:var(--fs-16); font-weight:600; line-height:1.4; }
    .section-body { padding:20px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .form-field { display:flex; flex-direction:column; gap:5px; }
    .form-field.full { grid-column:1/-1; }
    .field-label { font-size:var(--fs-14); font-weight:400; color:var(--text-secondary); }
    .field-value { font-size:var(--fs-14); font-weight:500; color:var(--text-primary); min-height:20px; }
    .field-value.field-value-small { font-size:var(--fs-14); }

    /* Progress nodes */
    .node-label { font-size:var(--fs-14); font-weight:500; }
    .node-desc  { font-size:var(--fs-12); color:var(--text-muted); margin-top:1px; }
    .node-n2-ext { display:inline-flex; margin-top:6px; }
    .node-date-display { font-size:var(--fs-12); color:var(--text-secondary); }

    /* Files */
    .file-item { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px 10px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius); margin-top:8px; }
    .file-type.p-tag { width:auto; min-width:0; height:auto; padding:3px 8px; font-size:var(--fs-12); font-weight:600; line-height:1.4; white-space:nowrap; flex-shrink:0; }
    .file-heading { display:flex; align-items:center; gap:8px; min-width:0; }
    .file-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--fs-12); font-weight:500; }
    .file-meta { grid-column:1 / -1; display:flex; align-items:center; gap:8px; white-space:nowrap; font-size:var(--fs-12); color:var(--text-muted); }
    .file-meta .p-tag { flex-shrink:0; white-space:nowrap; }
    .file-type.file-icon-pdf  { background:var(--red-light); color:var(--red); }
    .file-type.file-icon-txt  { background:var(--surface-2); color:var(--text-secondary); }
    .file-type.file-icon-docx { background:var(--docx-light); color:var(--docx); }


    /* User detail */
    .user-detail-actions { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:8px; }

    /* Relation list */
    .relation-list.section-body { padding:0; }
    .rel-item { display:flex; align-items:center; justify-content:space-between; padding:11px 20px; border-bottom:1px solid var(--border); }
    .rel-item:last-child { border-bottom:none; }
    .rel-item[role="link"] { cursor:pointer; }
    .rel-item[role="link"]:hover { background:#FAFBFC; }
    .rel-item[role="link"]:focus-visible { outline:2px solid var(--brand-700); outline-offset:-2px; }
    .rel-item-info { display:flex; align-items:center; gap:10px; }
    .rel-item-name { font-size:var(--fs-14); font-weight:500; }
    .rel-item-sub  { font-size:var(--fs-12); color:var(--text-muted); }

    /* Buttons */
    .empty-state { padding:40px 20px; text-align:center; color:var(--text-muted); font-size:var(--fs-14); }
    .text-muted { color:var(--text-muted); }
    .text-sm { font-size:var(--fs-12); }
    .info-row { display:flex; flex-direction:column; gap:12px; }


    /* Login page */
    .login-page { min-height:100vh; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; }
    .login-logo { margin-bottom:28px; }
    .login-logo-image { display:block; height:64px; width:auto; max-width:100%; object-fit:contain; }
    .login-title { font-size:var(--fs-20); font-weight:600; line-height:1.4; color:var(--brand-700); margin-bottom:4px; }
    .login-title-solo { margin-bottom:28px; }
    .login-field { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
    .login-label { font-size:var(--fs-14); font-weight:400; color:var(--text-secondary); }
    .otp-hint { font-size:var(--fs-12); color:var(--text-muted); margin-bottom:20px; line-height:1.5; }
    .otp-hint strong { color:var(--brand-700); }
    .otp-input { letter-spacing:0.2em; font-size:var(--fs-20); text-align:center; }
    .login-demo-hint { margin-top:24px; padding-top:20px; border-top:1px solid var(--border); font-size:var(--fs-12); color:var(--text-muted); line-height:1.7; }
    .login-demo-hint code { font-family:var(--font); background:var(--surface-2); padding:1px 5px; border-radius:3px; color:var(--text-secondary); }


    /* 直客 checkbox */
    .required-mark { margin-left:2px; color:var(--red); }
    .direct-checkbox-row { display:flex; align-items:flex-start; gap:8px; }
  
    /* Application layout and the small visual differences from the Lara preset. */
    h1, h2, h3, p { margin:0; }
    body { margin:0; }
    .p-component { font-family:var(--font); }
    .p-button { white-space:nowrap; font-size:var(--fs-14); }
    .p-button.p-button-sm { font-size:var(--p-button-sm-font-size, 12px); }
    .p-button svg { flex-shrink:0; }
    .sidebar-menu { width:100%; min-width:0; flex-shrink:0; border:0; }
    .sidebar-menu .nav-item { display:flex; align-items:center; gap:10px; min-height:44px; padding:10px 12px; border-radius:7px; color:var(--text-secondary); text-decoration:none; }
    .sidebar-menu .nav-item > i { color:var(--text-muted); }
    .sidebar-menu .nav-item:hover { background:var(--bg); }
    .sidebar-menu .nav-item.active { background:var(--brand-50); color:var(--brand-700); font-weight:600; }
    .sidebar-menu .nav-item.active > i { color:var(--brand-700); }
    .sidebar-logout.p-button { width:100%; justify-content:flex-start; padding-inline:8px; }
    .sidebar-logout .p-button-label { flex:0 0 auto; }
    .avatar-sm { width:30px; height:30px; flex-shrink:0; }
    .user-avatar-lg { width:52px; height:52px; font-size:var(--fs-20); flex-shrink:0; }
    .search-box { flex:1; max-width:280px; min-width:180px; }
    .management-table { --p-datatable-row-hover-background:#FAFBFC; }
    .management-table .p-datatable-tbody > tr { cursor:pointer; }
    .personnel-table .p-datatable-thead > tr > th, .personnel-table .p-datatable-tbody > tr > td { white-space:nowrap; }
    .status-tag { white-space:nowrap; }
    .case-progress { margin-top:4px; }
    .section-card { margin-bottom:16px; overflow:hidden; }
    .section-card .p-panel-header { border-bottom:1px solid var(--border); }
    .section-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; }
    .section-title-group { display:flex; align-items:center; gap:8px; }
    .section-actions { display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:8px; }
    .case-timeline .p-timeline-event-opposite { display:none; }
    .case-timeline .p-timeline-event-content { padding:0 0 20px 12px; min-width:0; }
    .node-content { display:grid; grid-template-columns:minmax(0,1fr) 150px 80px; gap:12px; align-items:start; }
    .node-date-input { width:145px; }
    .list-actions { display:flex; align-items:center; gap:16px; }
    .user-tabs { flex:0 1 auto; min-width:0; max-width:100%; background:transparent; border-radius:0; --p-tabs-tab-background:transparent; --p-tabs-tab-hover-background:transparent; --p-tabs-tab-active-background:transparent; --p-tabs-tab-hover-color:var(--brand-700); }
    .user-tabs .p-tablist, .user-tabs .p-tablist-content { background:transparent; border:0; border-radius:inherit; }
    .user-tabs .p-tablist-tab-list { display:flex; gap:0; padding:0; border:0; background:transparent; }
    .user-tabs .p-tab { flex:0 0 auto; min-height:36px; margin:0; padding:8px 12px; border:0; border-radius:0; background:transparent; color:var(--text-secondary); font-size:var(--fs-14); font-weight:400; line-height:20px; white-space:nowrap; box-shadow:none; transition:color .15s; }
    /* PrimeVue injects its theme after this stylesheet; keep tab hover backgrounds transparent. */
    .user-tabs .p-tab:hover, .user-tabs .p-tab:not(.p-disabled):hover { background:transparent !important; border-radius:0; box-shadow:none !important; }
    .user-tabs .p-tab:first-child, .user-tabs .p-tab:last-child { border-radius:0; }
    .user-tabs .p-tab:not([aria-selected="true"]):not(.p-disabled):hover { color:var(--brand-700) !important; }
    .user-tabs .p-tab[aria-selected="true"] { background:transparent; border:0; color:var(--brand-700); font-weight:600; box-shadow:none; }
    .user-tabs .p-tab[aria-selected="true"]:hover { background:transparent; }
    .user-tabs .p-tab:focus-visible { outline:2px solid var(--brand-700); outline-offset:-2px; }
    .user-tabs .p-tablist-active-bar { display:none; }
    .login-card { width:100%; max-width:400px; min-height:600px; --p-card-body-padding:32px; --p-card-border-radius:16px; --p-card-shadow:0 4px 24px rgba(0,0,0,.08); }
    @media (max-height:640px) { .login-page { align-items:flex-start; } }
    @media (max-width:480px) { .login-card { --p-card-body-padding:24px; } }
    .login-input { width:100%; }
    .login-input .p-inputtext { width:100%; }
    .login-input .p-password-toggle-mask-icon { cursor:pointer; }
    .login-btn { margin-top:4px; }
    .login-back { margin-top:14px; }
    .terminated-banner, .overdue-banner, .pdf-pw-banner { margin-bottom:16px; }
    .upload-hint { display:block; width:100%; padding:24px 18px; text-align:center; color:var(--text-muted); cursor:pointer; }
    .upload-hint:hover { background:var(--brand-50); }
    .upload-hint:focus-visible { outline:2px solid var(--brand-700); outline-offset:-2px; }
    @media (max-width:1100px) {
      .detail-layout { grid-template-columns:1fr; }
      .content { padding:20px; }
    }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <!-- Login page -->
  <div v-if="!loggedIn" class="login-page">
    <p-card class="login-card">
      <template #content>
        <div class="login-logo">
          <img class="login-logo-image" src="https://www.tshbiopharm.com/rwd1427/Store/OwnImage/logo.png" alt="東生華製藥 tshbiopharm">
        </div>
        <!-- Step 1: 帳號 + 使用者代號 -->
        <template v-if="loginStep === 'credentials'">
          <div class="login-title login-title-solo">後台管理系統</div>
          <div class="login-field">
            <label class="login-label" for="login-email">電子郵件</label>
            <p-input-text id="login-email" class="login-input" type="email" v-model="loginEmail" placeholder="admin@tsh.com" @keyup.enter="submitCredentials" :invalid="!!loginError" fluid></p-input-text>
          </div>
          <div class="login-field">
            <label class="login-label" for="login-password">使用者代號</label>
            <p-password input-id="login-password" class="login-input" v-model="loginPassword" placeholder="••••••••" @keyup.enter="submitCredentials" :invalid="!!loginError" fluid :feedback="false" toggle-mask></p-password>
          </div>
          <p-button class="login-btn" @click="submitCredentials" type="button" fluid>登入</p-button>
          <div class="login-demo-hint">
            示範帳號：
            <code>admin@tsh.com</code>
            使用者代號：
            <code>admin.li</code>
            OTP：
            <code>123456</code>
          </div>
        </template>
        <!-- Step 2: OTP 驗證 -->
        <template v-if="loginStep === 'otp'">
          <div class="login-title">二階段驗證</div>
          <div class="otp-hint">
            驗證碼已發送至
            <strong>{{ loginEmail }}</strong>
            ，請於 5 分鐘內輸入。
          </div>
          <div class="login-field">
            <label class="login-label" for="login-otp">OTP 驗證碼</label>
            <p-input-text id="login-otp" class="login-input otp-input" type="text" inputmode="numeric" maxlength="6" v-model="loginOtp" placeholder="000000" @keyup.enter="submitOtp" :invalid="!!loginError" fluid></p-input-text>
          </div>
          <p-button class="login-btn" @click="submitOtp" type="button" fluid>驗證並登入</p-button>
          <p-button class="login-back" @click="loginStep='credentials'; loginError=''; loginOtp=''" type="button" link fluid>← 返回重新輸入帳號</p-button>
        </template>
      </template>
    </p-card>
  </div>
  <!-- Main app -->
  <div v-if="loggedIn" class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img src="https://www.tshbiopharm.com/rwd1427/Store/OwnImage/logo.png" alt="東生華製藥 tshbiopharm">
      </div>
      <p-menu :model="navigationItems" :dt="sidebarMenuTheme" class="sidebar-menu">
        <template #item="{ item, props }">
          <a v-bind="props.action" :class="['nav-item', { active: item.active }]" :aria-current="item.active ? 'page' : undefined">
            <i :class="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </template>
      </p-menu>
      <div class="sidebar-footer">
        <div class="sidebar-account">
          <div class="sidebar-account-info">
            <div class="sidebar-account-name">王崇霖 <p-tag class="sidebar-account-role" severity="info" value="管理員"></p-tag></div>
            <div class="sidebar-account-email" :title="loginEmail || 'admin@tsh.com'">{{ loginEmail || 'admin@tsh.com' }}</div>
          </div>
        </div>
        <p-button @click="logout" type="button" class="sidebar-logout" severity="secondary" :dt="sidebarLogoutTheme" size="small" icon="pi pi-sign-out" label="登出"></p-button>
      </div>
    </aside>
    <main ref="pageHost" class="page-host">
      <!-- ── 個案列表 ── -->
      <template v-if="page === 'cases'">
        <div class="topbar">
          <p-breadcrumb :model="[{ label: '個案管理' }]"></p-breadcrumb>
        </div>
        <div class="content">
          <div class="table-card">
            <p-toolbar class="table-toolbar">
              <template #start>
              <p-icon-field class="search-box">
                <p-input-icon class="pi pi-search"></p-input-icon>
                <p-input-text v-model="search" placeholder="搜尋姓名、個案ID、醫師…" size="small" fluid></p-input-text>
              </p-icon-field>

      const ext = file.name.split('.').pop().toLowerCase();

        toast.add({ severity:'warn', summary:'僅支援 PDF、TXT、DOCX 檔案', life:3000 });

        return;

      const size = file.size>1024*1024?(file.size/1024/1024).toFixed(1)+' MB':(file.size/1024).toFixed(0)+' KB';
      pendingFile.value = { file, name:file.name, size, ftype:ext };
    }
    function cancelFile() { pendingFile.value=null; }

      const isPdf = pendingFile.value.ftype === 'pdf';
      selectedCase.value.files.push({

        name: pendingFile.value.name,
        type: pendingFile.value.ftype,
        size: pendingFile.value.size,
        uploadedAt: new Date().toISOString().split('T')[0],

// Merge nested tokens so unspecified Lara defaults stay available.
function mergePreset(base, overrides) {
  const result = { ...base };
  Object.entries(overrides).forEach(([key, value]) => {
    result[key] = value && typeof value === 'object' && !Array.isArray(value)
      ? mergePreset(base?.[key] || {}, value)
      : value;
  });
  return result;
}
const theme = mergePreset(Lara, {
